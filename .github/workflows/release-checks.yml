name: Release checks

on:
  push:
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: release-checks-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  web:
    name: Web tests and build
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    defaults:
      run:
        working-directory: apps/web
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          persist-credentials: false
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7
        with:
          node-version-file: apps/web/.nvmrc
          cache: npm
          cache-dependency-path: apps/web/package-lock.json
      - run: npm install --global npm@11.21.1
      - run: npm ci
      - run: npm audit --audit-level=high
      - run: npm run lint
      - run: npm test
      - run: npm run build
      - run: npm run build:sites

  api:
    name: API and PostgreSQL
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    services:
      postgres:
        image: postgres:17
        env:
          POSTGRES_USER: postgres
          POSTGRES_PASSWORD: movely-ci-only
          POSTGRES_DB: postgres
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U postgres"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 12
    env:
      # Disposable service container only; never use a production connection.
      MOVELY_TEST_POSTGRES_CONNECTION_STRING: Host=localhost;Port=5432;Database=postgres;Username=postgres;Password=movely-ci-only
      MOVELY_REQUIRE_POSTGRES_TESTS: 'true'
      DOTNET_NOLOGO: 'true'
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          persist-credentials: false
      - uses: actions/setup-dotnet@a98b56852c35b8e3190ac28c8c2271da59106c68 # v6
        with:
          dotnet-version: '10.0.402'
      - name: Select the release SDK
        run: echo '{"sdk":{"version":"10.0.402","rollForward":"latestPatch"}}' > global.json
      - run: dotnet restore tests/api/Movely.Api.Tests/Movely.Api.Tests.csproj
      - run: dotnet test tests/api/Movely.Api.Tests/Movely.Api.Tests.csproj --configuration Release --no-restore --filter 'Category!=PostgreSqlIntegration'
      - run: dotnet test tests/api/Movely.Api.Tests/Movely.Api.Tests.csproj --configuration Release --no-build --no-restore --filter 'Category=PostgreSqlIntegration'
      - run: dotnet publish apps/api/src/Movely.Api/Movely.Api.csproj --configuration Release --no-restore --output '${{ runner.temp }}/movely-api'
